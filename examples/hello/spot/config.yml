---
# Deployment variables for the hello example.
# Values wrapped in ${...} are taken from the environment of the spot process.
vars:
  DEPLOY_TO: /var/www/hello
  VERSION_DIR: releases
  CURRENT_DIR: current
  SHARED_DIR: shared
  SHARED_PATHS: "log"
  PHP_BIN: "/usr/bin/php"
  SOURCE: ${SOURCE}
  VERSION: ${VERSION}
  SERVER_NAME: ${SERVER_NAME}
  HTTP_PORT: ${HTTP_PORT}
  PHP_FPM_SOCK: ${PHP_FPM_SOCK}
  # Override with -e RELOAD_NGINX:"service nginx reload" on hosts without systemd.
  RELOAD_NGINX: "systemctl reload nginx"
