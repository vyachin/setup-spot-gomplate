---
# Deploy playbook for the hello example.
#
#   spot --no-color --playbook spot.yml --task=deploy --target=hello \
#        --inventory=inventory.yml --env-file config.yml --key <ssh-key>
#
# The playbook demonstrates three things:
#   1. publishing a new application release without downtime (atomic symlink switch);
#   2. rolling out a new nginx config with `nginx -t` and a graceful reload;
#   3. managing a crontab entry idempotently, without touching other cron jobs.
user: deploy
ssh_shell: /bin/sh
ssh_temp: /tmp

targets:
  hello:
    groups: ["hello"]

tasks:
  - name: deploy
    commands:
      - name: validate deployment inputs
        script: |
          test -n "$SOURCE"
          test -f "$SOURCE"
          test -n "$VERSION"
          test -n "$DEPLOY_TO"
          test -n "$SERVER_NAME"
          test -n "$HTTP_PORT"
        options: { local: true }

      - name: prepare shared directories
        script: |
          test -n "$SHARED_PATHS"
          for path in $SHARED_PATHS; do
            mkdir -p "$DEPLOY_TO/$SHARED_DIR/$path"
          done

      - name: set release name
        script: |
          export RELEASE="$(date -u +%Y%m%d%H%M%SZ)-$$"
        options: { local: true }

      - name: reserve release directory
        script: |
          export RELEASE_PATH="$DEPLOY_TO/$VERSION_DIR/$RELEASE"
          export PACKAGE_PATH="$RELEASE_PATH/$(basename "$SOURCE")"
          mkdir -p "$RELEASE_PATH"

      - name: upload release archive
        copy: { "src": "$SOURCE", "dst": "$PACKAGE_PATH", "force": true, "mkdir": true }

      - name: extract release archive
        script: |
          tar -xzf "$PACKAGE_PATH" -C "$RELEASE_PATH"
          rm -f "$PACKAGE_PATH"
          test -f "$RELEASE_PATH/index.php"
          test -f "$RELEASE_PATH/REVISION"

      - name: link shared paths
        script: |
          for path in $SHARED_PATHS; do
            rm -rf "$RELEASE_PATH/$path"
            mkdir -p "$(dirname "$RELEASE_PATH/$path")"
            ln -s "$DEPLOY_TO/$SHARED_DIR/$path" "$RELEASE_PATH/$path"
          done

      - name: render templates
        script: |
          gomplate --input-dir . --include '*.tmpl' --output-map '{{ .in | strings.TrimSuffix ".tmpl" }}'
          test -s nginx-hello.conf
        options: { local: true }

      - name: upload nginx config
        copy: { "src": "nginx-hello.conf", "dst": "/tmp/hello-nginx.conf", "force": true }

      - name: install nginx config
        script: |
          config=/etc/nginx/sites-enabled/hello.conf
          backup=/tmp/hello.conf.previous
          if [ -f "$config" ]; then
            cp "$config" "$backup"
          else
            rm -f "$backup"
          fi
          install -m 0644 /tmp/hello-nginx.conf "$config"
          if ! nginx -t; then
            if [ -f "$backup" ]; then
              install -m 0644 "$backup" "$config"
            else
              rm -f "$config"
            fi
            echo "nginx -t failed, previous configuration restored" >&2
            exit 1
          fi
        options: { sudo: true }

      - name: activate release
        script: |
          config=/etc/nginx/sites-enabled/hello.conf
          backup=/tmp/hello.conf.previous
          current="$DEPLOY_TO/$CURRENT_DIR"
          if [ -L "$current" ]; then
            previous="$(readlink -f "$current")"
          else
            previous=""
          fi

          rollback() {
            if [ -f "$backup" ]; then
              install -m 0644 "$backup" "$config"
            else
              rm -f "$config"
            fi
            if [ -n "$previous" ] && [ -d "$previous" ]; then
              rm -rf "$current.new"
              ln -sfn "$previous" "$current.new"
              mv -Tf "$current.new" "$current"
            fi
            nginx -t
            $RELOAD_NGINX
            rm -f "$backup"
            if [ -n "$previous" ]; then
              echo "rolled back to $previous" >&2
            else
              echo "rolled back, there was no previous release" >&2
            fi
          }

          # Graceful reload: old workers finish in-flight requests while new
          # workers pick up the tested config. No connections are dropped.
          $RELOAD_NGINX

          rm -rf "$current.new"
          ln -sfn "$RELEASE_PATH" "$current.new"
          mv -Tf "$current.new" "$current"

          # Old workers keep the previous config until they finish in-flight
          # requests, so retry until a new worker answers with the new config
          # and the new release is actually rendered.
          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f "$headers_file" "$body_file"' EXIT

          attempts=0
          until curl -fsS --max-time 5 -D "$headers_file" -o "$body_file" \
                  -H "Host: $SERVER_NAME" "http://127.0.0.1:$HTTP_PORT/" \
                && grep -Fq "$VERSION" "$body_file" \
                && grep -Fq "X-Hello-Release: $VERSION" "$headers_file"; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 20 ]; then
              echo "health check failed for $RELEASE_PATH" >&2
              rollback
              exit 1
            fi
            sleep 0.5
          done

          rm -f "$backup"
          echo "release $VERSION is live"
        options: { sudo: true }

      - name: update cron task
        script: |
          current_crontab="$(mktemp)"
          cleaned_crontab="$(mktemp)"
          trap 'rm -f "$current_crontab" "$cleaned_crontab"' EXIT

          crontab -l > "$current_crontab" 2>/dev/null || true
          awk '
            /^# BEGIN hello-example \(managed by spot\)$/ { skip = 1; next }
            /^# END hello-example \(managed by spot\)$/   { skip = 0; next }
            !skip
          ' "$current_crontab" > "$cleaned_crontab"

          {
            if [ -s "$cleaned_crontab" ] && [ -n "$(tail -c 1 "$cleaned_crontab")" ]; then
              printf '\n'
            fi
            cat "$cleaned_crontab"
            printf '%s\n' \
              '# BEGIN hello-example (managed by spot)' \
              "17 * * * * $PHP_BIN $RELEASE_PATH/bin/cron.php >> $DEPLOY_TO/$SHARED_DIR/log/cron.log 2>&1" \
              '# END hello-example (managed by spot)'
          } > "$current_crontab"

          crontab "$current_crontab"
          crontab -l | grep -F "$RELEASE_PATH/bin/cron.php" >/dev/null
          echo "cron task now points to $RELEASE_PATH"

      - name: prune old releases
        script: |
          current="$(readlink -f "$DEPLOY_TO/$CURRENT_DIR")"
          find "$DEPLOY_TO/$VERSION_DIR" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -rn | tail -n +4 | cut -d' ' -f2- \
            | while IFS= read -r dir; do
                [ "$(readlink -f "$dir")" = "$current" ] && continue
                rm -rf "$dir"
              done
